name: cpu-monitoring-webapp
version: '2.0.4'
platforms:
  amd64:
  arm64:
  armhf:
  ppc64el:
  riscv64:
  s390x:
base: core26
title: CPU Monitoring - CPU, GPU & NPU
license: GPL-3.0-only
contact: https://github.com/mauringo/CPU-monitoring-webAPP/issues
issues: https://github.com/mauringo/CPU-monitoring-webAPP/issues
source-code: https://github.com/mauringo/CPU-monitoring-webAPP
website: https://github.com/mauringo/CPU-monitoring-webAPP
summary: Linux CPU, GPU and NPU monitoring with live nvtop in your browser
description: |
  Monitor Linux CPU, GPU, NPU and RAM usage from a self-hosted web dashboard.
  CPU Monitoring combines system performance charts, hardware inventory and
  a live nvtop terminal for graphics and AI accelerator monitoring.

  Designed for lightweight ARM64 monitoring on RUBIK Pi and Raspberry Pi 5,
  with bounded chart history, shared accelerator samples and adjustable
  refresh intervals. Verified on RUBIK Pi 3; Raspberry Pi 5 hardware validation
  is pending. Qualcomm NPU features require compatible Qualcomm hardware.

  GPU and NPU monitoring:
  - View GPU utilization history, video memory (VRAM), temperature and power
    where supported by your hardware, drivers and available telemetry tools.
  - Read NVIDIA GPU metrics through nvidia-smi and AMD GPU utilization and
    video memory through the Linux amdgpu driver.
  - Discover NPUs and AI accelerators, and view supported devices directly
    in the embedded, read-only nvtop terminal with live graphs and processes.
  - Switch between light, dark and system themes across charts and terminal.

  Linux system monitoring:
  - Track CPU and RAM usage, per-core activity and top resource-using processes.
  - Explore interactive CPU and RAM history graphs and export samples as CSV.
  - Inspect network traffic, disks, NVMe storage, USB and PCI devices, cameras
    and available temperature sensors.

  Open http://localhost:12121 for the overview or
  http://localhost:12121/accelerators for GPU and NPU monitoring. Use the
  monitored machine's IP address to access the dashboard on a trusted network.

  Hardware metrics and nvtop device support depend on installed drivers,
  tool versions and Snap permissions. Native NPU charts show discovery and
  available sensors; NPU utilization in nvtop requires a supported backend.
  The Help menu explains hardware permissions and available utilities.

confinement: strict
grade: stable

    
apps:

 
  flask-server: 
    command: bin/runserver.wrapper  
    plugs:
      - network-control
      - network-observe
      - network
      - network-bind
      - process-control
      - raw-usb
      - camera
      - gsettings
      - udisks2
      - hardware-observe
      - opengl
      - system-observe
      - mount-observe
    daemon: simple 
    
  desktop-launch:
    command: bin/desktop-launch
    plugs:
      - desktop  
      

parts:

  # Qualcomm userspace dependencies are built only for ARM64 targets.
  fastrpc:
    plugin: nil
    source: https://github.com/qualcomm/fastrpc.git
    source-commit: d247519650fe5cb16de6c78edaa95bcc4be25073
    build-packages: [autoconf, automake, libtool, pkg-config, build-essential, libyaml-dev, libbsd-dev]
    stage-packages: [libyaml-0-2, libbsd0]
    override-build: |
      set -eu
      [ "$CRAFT_ARCH_BUILD_FOR" = arm64 ] || exit 0
      cd "$CRAFT_PART_SRC"
      autoreconf -fi
      cd "$CRAFT_PART_BUILD"
      "$CRAFT_PART_SRC/configure" --prefix=/usr --libdir=/usr/lib
      make -j"$CRAFT_PARALLEL_BUILD_COUNT"
      make DESTDIR="$CRAFT_PART_INSTALL" install
      install -Dm644 "$CRAFT_PART_SRC/LICENSE.txt" "$CRAFT_PART_INSTALL/usr/share/licenses/fastrpc/LICENSE.txt"
    stage:
      - usr/lib/*.so*
      - usr/lib/*/lib*.so*
      - usr/include/fastrpc
      - usr/share/licenses
      - usr/share/doc
    prime:
      - -usr/include

  libqcnpuperf:
    after: [fastrpc]
    plugin: nil
    source: https://github.com/qualcomm/libqcnpuperf.git
    source-commit: 34261de1e689d0e718205e4ba8aae82108fd7881
    build-packages: [cmake, build-essential, pkg-config]
    override-build: |
      set -eu
      [ "$CRAFT_ARCH_BUILD_FOR" = arm64 ] || exit 0
      # Upstream .pc paths must be prefix-relative for staged builds.
      sed -i 's|^libdir=.*|libdir=${prefix}/@CMAKE_INSTALL_LIBDIR@|; s|^includedir=.*|includedir=${prefix}/@CMAKE_INSTALL_INCLUDEDIR@|' "$CRAFT_PART_SRC/qcnpuperf.pc.in"
      cmake -S "$CRAFT_PART_SRC" -B "$CRAFT_PART_BUILD" \
        -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
        -DCMAKE_INSTALL_LIBDIR=lib -DQCNPU_PERF_BUILD_CLI=OFF \
        -DFASTRPC_INCLUDE_DIR="$CRAFT_STAGE/usr/include/fastrpc" \
        -DFASTRPC_LIBRARY="$CRAFT_STAGE/usr/lib/libcdsprpc.so"
      cmake --build "$CRAFT_PART_BUILD" -j"$CRAFT_PARALLEL_BUILD_COUNT"
      DESTDIR="$CRAFT_PART_INSTALL" cmake --install "$CRAFT_PART_BUILD"
      install -Dm644 "$CRAFT_PART_SRC/LICENSE.txt" "$CRAFT_PART_INSTALL/usr/share/licenses/libqcnpuperf/LICENSE.txt"
    prime:
      - -usr/include
      - -usr/lib/pkgconfig

  nvtop:
    after: [libqcnpuperf]
    plugin: nil
    source: https://github.com/Syllo/nvtop.git
    source-commit: 55896ac28e40f033af70b7bfbd8bf79b31522d8d
    build-packages: [cmake, build-essential, pkg-config, libncurses-dev, libdrm-dev, libudev-dev]
    stage-packages: [libncursesw6, libtinfo6, libdrm2, libudev1, ncurses-term]
    override-build: |
      set -eu
      export PKG_CONFIG_PATH="$CRAFT_STAGE/usr/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
      qcom_required=OFF
      if [ "$CRAFT_ARCH_BUILD_FOR" = arm64 ]; then
        qcom_required=ON
        # Require our freshly built library, not a host-installed copy.
        PKG_CONFIG_SYSROOT_DIR="$CRAFT_STAGE" pkg-config --exists qcnpuperf
      fi
      cmake -S "$CRAFT_PART_SRC" -B "$CRAFT_PART_BUILD" \
        -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
        -DNVIDIA_SUPPORT=ON -DAMDGPU_SUPPORT=ON -DINTEL_SUPPORT=ON \
        -DMSM_SUPPORT=ON -DBUILD_TESTING=OFF -DUSE_LIBUDEV_OVER_LIBSYSTEMD=ON \
        -DCMAKE_C_FLAGS="-I$CRAFT_STAGE/usr/include" \
        -DCMAKE_EXE_LINKER_FLAGS="-L$CRAFT_STAGE/usr/lib -Wl,-rpath-link,$CRAFT_STAGE/usr/lib" \
        -DCMAKE_INSTALL_RPATH='${ORIGIN}/../lib'
      if [ "$qcom_required" = ON ]; then
        grep -q '^NPUPERF_FOUND:INTERNAL=1$' "$CRAFT_PART_BUILD/CMakeCache.txt"
        grep -q 'extract_npuinfo_qualcomm.c' "$CRAFT_PART_BUILD/src/CMakeFiles/nvtop.dir/build.make"
      fi
      cmake --build "$CRAFT_PART_BUILD" -j"$CRAFT_PARALLEL_BUILD_COUNT"
      DESTDIR="$CRAFT_PART_INSTALL" cmake --install "$CRAFT_PART_BUILD"
      install -Dm644 "$CRAFT_PART_SRC/COPYING" "$CRAFT_PART_INSTALL/usr/share/licenses/nvtop/COPYING"

  flask:
    plugin: python
    python-requirements:
      - requirements.txt
    source: .
    stage-packages:
      - python3-venv
      - usbutils
      - pciutils
      - v4l-utils
      - util-linux
      - net-tools
    build-packages:
      - python3-dev
      - python3-wheel
      - build-essential
      - python3-setuptools
  

  python-code:  
    source: ./Flask/
    plugin: dump
    organize:
      '*': bin/Flask/

  shscripts:  
    source: ./shscripts/
    plugin: dump
    organize:
      '*': bin/


