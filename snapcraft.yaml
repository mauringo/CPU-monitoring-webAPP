name: cpu-monitoring-webapp
version: '1.1.1'
base: core26
title: CPU Monitoring
license: MIT
contact: https://github.com/mauringo/CPU-monitoring-webAPP/issues
issues: https://github.com/mauringo/CPU-monitoring-webAPP/issues
source-code: https://github.com/mauringo/CPU-monitoring-webAPP
website: https://github.com/mauringo/CPU-monitoring-webAPP
summary: Simple WebAPP to monitor your system usage
description: |
    Install the app and navigate to http://yourDeviceIp:12121 and monitor your device CPU/RAM
     usage
      
confinement: strict
grade: stable

    
apps:

 
  flask-server: 
    command: bin/runserver.wrapper  
    plugs:
      - network-control
      - network-observe
      - network
      - network-bind
      - process-control
      - raw-usb
      - gsettings
      - udisks2
      - hardware-observe
      - system-observe
      - mount-observe
    daemon: simple 
    
  desktop-launch:
    command: bin/desktop-launch
    plugs:
      - desktop  
      

parts:

  flask:
    plugin: python
    python-requirements:
      - requirements.txt
    source: .
    stage-packages:
      - python3-venv
      - usbutils
      - pciutils
      - v4l-utils
    build-packages:
      - python3-dev
      - python3-wheel
      - build-essential
      - python3-setuptools
  

  python-code:  
    source: ./Flask/
    plugin: dump
    organize:
      '*': bin/Flask/

  shscripts:  
    source: ./shscripts/
    plugin: dump
    organize:
      '*': bin/


